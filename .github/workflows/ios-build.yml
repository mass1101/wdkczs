name: iOS Build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # 3.47 起最低 iOS 15，要支持 iOS 14 必须用 3.44（最后支持 iOS 14 的稳定版）
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          cp -R Runner.app Payload/
          zip -qry wgkczs-ios-unsigned.ipa Payload
          mv wgkczs-ios-unsigned.ipa "$GITHUB_WORKSPACE"

      # Release 附件不占 Actions artifact 存储配额（账号配额已满）
      - name: Upload to Release (tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: wgkczs-ios-unsigned.ipa

      # 手动触发时没有 tag，artifact 仅尽力上传（配额满时不让构建变红）
      - name: Upload artifact (manual runs, best-effort)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: wgkczs-ios-unsigned
          path: wgkczs-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 1
